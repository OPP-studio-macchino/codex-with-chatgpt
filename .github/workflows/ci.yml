name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/product-ux-*'
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node ${{ matrix.node }} (Linux-compatible)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      C2C_GIT_SNAPSHOT_MS: '10000'
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build compiled Git worker for test runner
        run: pnpm build

      - name: Prepare isolated test directories
        run: |
          mkdir -p "$RUNNER_TEMP/c2c-test-fixtures" "$RUNNER_TEMP/c2c-state"
          echo "C2C_TEST_TMP_ROOT=$RUNNER_TEMP/c2c-test-fixtures" >> "$GITHUB_ENV"
          echo "C2C_STATE_DIR=$RUNNER_TEMP/c2c-state" >> "$GITHUB_ENV"
          echo "C2C_RECONCILIATION_TEST_BUILD=$GITHUB_WORKSPACE/dist" >> "$GITHUB_ENV"

      - name: Linux-compatible Vitest suites (macOS-only suites gated separately)
        run: |
          # Five excluded suites test macOS-specific native approval, Git publish
          # and ps/lsof process identity; macOS RC2 testing covers all 102 files.
          # Do not claim those suites were run on Ubuntu.
          pnpm exec vitest run --maxWorkers=2 \
            --exclude tests/codex-approval-scope.test.ts \
            --exclude tests/git-publish.test.ts \
            --exclude tests/git-push-recovery.test.ts \
            --exclude tests/local-approval.test.ts \
            --exclude tests/reconciliation-processes.test.ts

      - name: Validate Skill consent boundaries
        run: pnpm validate:skill

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

name: Preview release

on:
  push:
    branches: [feat/product-ux-no-mention-20260930]
    paths: [.github/workflows/preview-release.yml]

permissions:
  contents: read

concurrency:
  group: preview-dev6-publication
  cancel-in-progress: false

jobs:
  prepare-security-lock:
    if: github.repository == 'OPP-studio-macchino/codex-with-chatgpt' && github.ref == 'refs/heads/feat/product-ux-no-mention-20260930'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Limit repair to the reviewed candidate and three affected packages
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c6633c1714411279405f038642a2e03f2d304829 HEAD
          test "$(node -p "require('./package.json').version")" = '0.4.0-dev.6'
          test -z "$(git tag --list v0.4.0-dev.6)"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pnpm-workspace.yaml')
          text = p.read_text()
          assert 'overrides:' not in text, 'Inspect existing overrides rather than replace them'
          text += "\n# Patched transitive versions from the production audit; keep existing supply-chain controls.\noverrides:\n  'fast-uri@>=3.0.0 <3.1.8': 3.1.8\n  'qs@>=6.0.0 <6.16.0': 6.16.0\n  'ip-address@>=10.0.0 <10.7.1': 10.7.1\n"
          p.write_text(text)
          PY
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          pnpm audit --prod --json > /tmp/c2c-production-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/c2c-production-audit.json').read_text())
          counts = report['metadata']['vulnerabilities']
          assert not any(counts.values()), counts
          print('Production audit:', counts)
          PY
      - name: Commit only the reviewed dependency configuration and lock
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json src tests scripts
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == {'pnpm-workspace.yaml', 'pnpm-lock.yaml'}, changed
          PY
          git diff --check
          git fetch origin feat/product-ux-no-mention-20260930
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pnpm-workspace.yaml pnpm-lock.yaml
          git commit -m 'fix: update vulnerable transitive packages before dev.6 release'
          git push origin HEAD:refs/heads/feat/product-ux-no-mention-20260930
          echo 'Dependency lock repaired; full validation and publication are a separate gated step.' >> "$GITHUB_STEP_SUMMARY"
